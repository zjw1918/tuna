[project]
name = "tuna"
version = "0.1.0"
description = "Build and train your own small multimodal LLM from scratch, on one gaming GPU."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "tokenizers>=0.21",
    "numpy>=2.0",
    "nvidia-ml-py>=12.0",
    "opencc-python-reimplemented>=0.1.7",
    "transformers>=4.50",
    "pyarrow>=18",
    "pillow>=11",
]

[tool.setuptools]
packages = ["tuna"]
